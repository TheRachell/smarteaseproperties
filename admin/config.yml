# SmartEase Properties — CMS configuration
#
# This file tells the admin UI (Decap CMS) which content files exist and
# what fields each one has. It does NOT need to change when you edit
# content day-to-day — only when a brand-new editable page or field is
# added to the site.
#
# Backend: this is set up for Vercel. Login is handled by GitHub OAuth
# (via the two small functions in /api), and every save becomes a commit
# to the "content_repo" below, which Vercel then rebuilds and redeploys
# automatically. Your 2–5 admins need to be added as collaborators on that
# GitHub repo — see /admin/README.md for the one-time setup steps.

backend:
  name: github
  repo: your-github-username/your-repo-name  # ← change this to your actual GitHub repo
  branch: main
  base_url: https://your-project.vercel.app  # ← change this to your actual Vercel URL
  auth_endpoint: api/auth

publish_mode: simple
media_folder: "images"
public_folder: "/images"

collections:
  - name: "home"
    label: "Home Page"
    files:
      - name: "home"
        label: "Home — Hero Section"
        file: "content/index.json"
        fields:
          - { label: "Eyebrow text (small line above heading)", name: "hero_eyebrow", widget: "string" }
          - { label: "Heading — line 1", name: "hero_heading_line1", widget: "string" }
          - { label: "Heading — italic word", name: "hero_heading_em", widget: "string" }
          - { label: "Heading — line 2", name: "hero_heading_line2", widget: "string" }
          - { label: "Statement paragraph", name: "hero_statement", widget: "text" }
          - { label: "Hero background image", name: "hero_image", widget: "image" }
          - label: "Stat pills (3, left to right)"
            name: "hero_stats"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }

  - name: "metroluxe"
    label: "Metroluxe"
    files:
      - name: "metroluxe"
        label: "Metroluxe — Page Content"
        file: "content/properties/metroluxe.json"
        fields:
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Intro paragraph", name: "intro", widget: "text" }
          - { label: "Main photo", name: "hero_image", widget: "image" }
          - label: "Pricing"
            name: "pricing"
            widget: "list"
            fields:
              - { label: "Unit name", name: "title", widget: "string" }
              - { label: "Price (numbers only, e.g. 14,000,000)", name: "price", widget: "string" }

  - name: "luma"
    label: "Luma Apartments"
    files:
      - name: "luma"
        label: "Luma Apartments — Page Content"
        file: "content/properties/luma-apartments.json"
        fields:
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Intro paragraph", name: "intro", widget: "text" }
          - label: "Outright ownership pricing"
            name: "pricing"
            widget: "list"
            fields:
              - { label: "Unit name", name: "title", widget: "string" }
              - { label: "Price (numbers only)", name: "price", widget: "string" }
              - { label: "Note (e.g. deposit amount)", name: "note", widget: "string" }
          - label: "Shortlet income estimate"
            name: "shortlet_income"
            widget: "list"
            fields:
              - { label: "Unit name", name: "title", widget: "string" }
              - { label: "Monthly income (numbers only)", name: "price", widget: "string" }
              - { label: "Yearly note (e.g. ≈ ₦4,800,000 / year)", name: "note", widget: "string" }

  - name: "meridian"
    label: "The Meridian"
    files:
      - name: "meridian"
        label: "The Meridian — Page Content"
        file: "content/properties/the-meridian.json"
        fields:
          - { label: "Page title", name: "title", widget: "string" }
          - { label: "Intro paragraph", name: "intro", widget: "text" }
          - label: "Pricing"
            name: "pricing"
            widget: "list"
            fields:
              - { label: "Unit name", name: "title", widget: "string" }
              - { label: "Price (numbers only)", name: "price", widget: "string" }
